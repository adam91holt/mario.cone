<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MARIO.CONE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230d1016'/><path d='M16 4 L25 28 H7 Z' fill='%23FF6B1A'/><rect x='10' y='19' width='12' height='3.4' fill='%23FFF8F0'/><rect x='12.4' y='12' width='7.2' height='3' fill='%23FFF8F0'/></svg>" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d1016;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  }
  #game {
    display: block; width: 100vw; height: 100vh;
    /* The canvas is the whole viewport; the HUD is a DOM layer above it. */
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #FFF8F0; background: #0d1016; z-index: 50;
    font-size: 1.1rem; letter-spacing: .22em; text-transform: uppercase;
  }
  #boot .mark {
    font-size: 2.6rem; font-weight: 900; letter-spacing: -.02em;
    color: #FF6B1A; text-transform: none; margin-bottom: .6rem;
  }
  #boot .mark span { color: #FFC300; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="boot">
    <div style="text-align:center">
      <div class="mark">mario<span>.</span>cone</div>
      <div>loading</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
