<title>MARIO.CONE</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d1016;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  }
  #game {
    display: block; width: 100vw; height: 100vh;
    /* The canvas is the whole viewport; the HUD is a DOM layer above it. */
    touch-action: none;
  }

  /* The loading screen — and it is the *same mark* the title screen raises.
     It was not: this used to be lowercase "mario.cone" set in Trebuchet MS 900
     with a yellow full stop, and #boot is only removed at the very end of
     boot() in main.ts — after the track, the world, seven vehicle rigs and the
     post stack have all been built — so on a cold load the game introduced
     itself twice, in two logotypes, several seconds apart, and neither of them
     was the other.

     The SVG below is the output of wordmark() in src/ui/menus/art.ts, inlined
     because this frame has to paint before a single module has parsed. It is
     the one duplicated asset in the project; regenerate it with

       node --experimental-strip-types -e "import('./src/ui/menus/art.ts')
         .then(m => process.stdout.write(m.wordmark()))"
  */
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #0d1016; z-index: 50;
  }
  #boot .wrap { width: min(62vw, 620px); text-align: center; }
  #boot svg.wm { display: block; width: 100%; height: auto; overflow: visible; }
  /* The two hazard rails that frame every other screen in the product. */
  #boot .rail {
    position: fixed; left: 0; right: 0; height: 1.1vh; min-height: 7px;
    background: repeating-linear-gradient(114deg,
      #FFC300 0 1.1vw, #14171E 1.1vw 2.2vw);
    opacity: .92;
  }
  #boot .rail.t { top: 0; }
  #boot .rail.b { bottom: 0; }
  /* The loading state sits *under* the mark rather than beside a second one. */
  #boot .msg {
    margin-top: 1.6rem;
    color: rgba(255,248,240,.62); font-size: .82rem; font-weight: 800;
    letter-spacing: .34em; text-transform: uppercase;
  }
  #boot .bar {
    margin: .9rem auto 0; width: 46%; height: .5rem;
    border-radius: .25rem; overflow: hidden;
    background: rgba(255,248,240,.1);
    box-shadow: inset 0 0 0 1px rgba(9,11,15,.9);
  }
  #boot .bar i {
    display: block; height: 100%; width: 34%;
    background: linear-gradient(90deg, #FFC300, #FF6B1A);
    animation: bootslide 1.25s ease-in-out infinite alternate;
  }
  /* The one CSS animation in the whole product, and it is deliberate: it lives
     on the frame *before* the harness exists, so no capture can ever
     photograph it at an unpredictable point in its timeline. */
  @keyframes bootslide { from { transform: translateX(-8%); } to { transform: translateX(200%); } }
</style>
</head>
